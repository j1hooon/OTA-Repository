---
- name: "Epic 3: Deploy OTA API Service to Active and Standby K3s Clusters"
  hosts: mgmt
  become: false
  tags:
    - ota-deploy
  tasks:
    - name: Create K8s manifests directory
      file:
        path: /home/ubuntu/ansible-ota/manifests
        state: directory
        mode: '0755'

    - name: Generate and apply K8s manifests for both clusters
      shell: |
        cat << 'MANIFEST' | kubectl --context={{ item }} apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ota-api-config
          namespace: default
        data:
          default.conf: |
            server {
                listen 80;
                location /health {
                    access_log off;
                    add_header Content-Type application/json;
                    return 200 '{"status":"UP","cluster":"{{ item }}"}\n';
                }
                location / {
                    add_header Content-Type application/json;
                    return 200 '{"service":"ESP32-OTA-Gateway","handled_by_cluster":"{{ item }}","status":"READY"}\n';
                }
            }
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ota-api-server
          namespace: default
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: ota-api
          template:
            metadata:
              labels:
                app: ota-api
            spec:
              containers:
              - name: ota-api
                image: nginx:1.27-alpine
                ports:
                - containerPort: 80
                volumeMounts:
                - name: config-vol
                  mountPath: /etc/nginx/conf.d
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 2
                  periodSeconds: 3
              volumes:
              - name: config-vol
                configMap:
                  name: ota-api-config
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: ota-api-svc
          namespace: default
        spec:
          type: NodePort
          selector:
            app: ota-api
          ports:
          - port: 80
            targetPort: 80
            nodePort: 30080
        MANIFEST
      loop:
        - active
        - standby

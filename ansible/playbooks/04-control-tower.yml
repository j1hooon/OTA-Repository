---
- name: "Epic 2: Setup Control Tower (PostgreSQL, Redis, HAProxy, Jenkins)"
  hosts: mgmt
  become: true
  vars_files:
    - ../secrets.yml
  vars:
    control_dir: /opt/ota-control-tower
    mgmt_internal_ip: "172.16.10.1"
    active_node_ip: "172.16.100.1"
    standby_node_ip: "172.16.200.1"
    ota_nodeport: 30080

  tasks:
    - name: 1. Create Control Tower directories
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - "{{ control_dir }}"
        - "{{ control_dir }}/postgres/data"
        - "{{ control_dir }}/postgres/init"
        - "{{ control_dir }}/redis/data"
        - "{{ control_dir }}/haproxy"
        - "{{ control_dir }}/jenkins_home"
      tags:
        - control-tower
        - haproxy
        - db

    - name: 2. Create PostgreSQL Schema Init Script (init.sql)
      copy:
        dest: "{{ control_dir }}/postgres/init/01-init-schema.sql"
        mode: '0644'
        content: |
          CREATE TABLE IF NOT EXISTS firmware_releases (
              id SERIAL PRIMARY KEY,
              version VARCHAR(32) UNIQUE NOT NULL,
              s3_url TEXT NOT NULL,
              sha256_hash CHAR(64) NOT NULL,
              file_size_bytes BIGINT NOT NULL,
              release_notes TEXT,
              created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS devices (
              device_id VARCHAR(64) PRIMARY KEY,
              device_group VARCHAR(64) DEFAULT 'default',
              current_version VARCHAR(32),
              last_known_ip VARCHAR(45),
              registered_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS ota_deployment_history (
              deployment_id SERIAL PRIMARY KEY,
              device_id VARCHAR(64) REFERENCES devices(device_id),
              target_version VARCHAR(32) NOT NULL,
              status VARCHAR(20) NOT NULL CHECK (status IN ('SUCCESS', 'FAILED', 'ROLLED_BACK')),
              error_code VARCHAR(50),
              duration_ms INTEGER,
              handled_by_cluster VARCHAR(20),
              completed_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS device_telemetry_logs (
              log_id BIGSERIAL PRIMARY KEY,
              device_id VARCHAR(64) REFERENCES devices(device_id),
              firmware_version VARCHAR(32),
              rssi INTEGER,
              free_heap_bytes INTEGER,
              battery_mv INTEGER,
              extra_payload JSONB,
              recorded_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
          );

          CREATE INDEX IF NOT EXISTS idx_ota_history_device ON ota_deployment_history(device_id);
          CREATE INDEX IF NOT EXISTS idx_telemetry_recorded_at ON device_telemetry_logs(recorded_at);
      tags:
        - control-tower
        - db

    - name: 3. Create HAProxy Configuration (Active-Standby Failover)
      copy:
        dest: "{{ control_dir }}/haproxy/haproxy.cfg"
        mode: '0644'
        content: |
          global
              log stdout format raw local0

          defaults
              log     global
              mode    http
              option  httplog
              option  dontlognull
              timeout connect 3000ms
              timeout client  50000ms
              timeout server  50000ms

          frontend stats
              bind *:8404
              stats enable
              stats uri /stats
              stats refresh 5s

          frontend ota_api_front
              bind *:8000
              default_backend ota_clusters_back

          backend ota_clusters_back
              option httpchk GET /health
              http-check expect status 200
              server active_cluster {{ active_node_ip }}:{{ ota_nodeport }} check inter 1000ms fall 2 rise 2
              server standby_cluster {{ standby_node_ip }}:{{ ota_nodeport }} check inter 1000ms fall 2 rise 2 backup
      register: haproxy_config
      tags:
        - control-tower
        - haproxy

    - name: 4. Create Docker Compose file (Using Vault Secrets)
      copy:
        dest: "{{ control_dir }}/docker-compose.yml"
        mode: '0600'
        content: |
          services:
            postgres:
              image: postgres:16-alpine
              container_name: ota-postgres
              restart: unless-stopped
              environment:
                POSTGRES_USER: ota_admin
                POSTGRES_PASSWORD: "{{ pg_password }}"
                POSTGRES_DB: ota_db
                TZ: Asia/Seoul
              ports:
                - "{{ mgmt_internal_ip }}:5432:5432"
              volumes:
                - ./postgres/data:/var/lib/postgresql/data
                - ./postgres/init:/docker-entrypoint-initdb.d:ro
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ota_admin -d ota_db"]
                interval: 5s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              container_name: ota-redis
              restart: unless-stopped
              command: >
                redis-server
                --requirepass {{ redis_password }}
                --maxmemory 512mb
                --maxmemory-policy allkeys-lru
                --appendonly yes
              ports:
                - "{{ mgmt_internal_ip }}:6379:6379"
              volumes:
                - ./redis/data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "-a", "{{ redis_password }}", "ping"]
                interval: 5s
                timeout: 3s
                retries: 5

            haproxy:
              image: haproxy:2.9-alpine
              container_name: ota-haproxy
              restart: unless-stopped
              ports:
                - "8000:8000"
                - "8404:8404"
              volumes:
                - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

            jenkins:
              image: jenkins/jenkins:lts-jdk21
              container_name: ota-jenkins
              dns:
                - 8.8.8.8
                - 1.1.1.1
              restart: unless-stopped
              user: root
              ports:
                - "8080:8080"
                - "50000:50000"
              volumes:
                - ./jenkins_home:/var/jenkins_home
                - /var/run/docker.sock:/var/run/docker.sock
                - /home/ubuntu/.kube:/root/.kube:ro
              tmpfs:
                - /ramdisk:rw,size=2g,mode=1777
      tags:
        - control-tower
        - haproxy
        - db

    - name: 5. Start Control Tower Containers
      shell: docker compose up -d
      args:
        chdir: "{{ control_dir }}"
      tags:
        - control-tower
        - haproxy
        - db

    - name: 6. Restart HAProxy if config changed
      shell: docker restart ota-haproxy
      when: haproxy_config.changed
      tags:
        - control-tower
        - haproxy

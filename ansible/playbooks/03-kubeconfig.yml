---
- name: "Epic 1-3: Fetch Kubeconfigs from Clusters"
  hosts: k3s_clusters
  become: true
  tags:
    - kubeconfig
  tasks:
    - name: Fetch k3s.yaml to mgmt-cluster
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/ubuntu/ota-platform/ansible/{{ inventory_hostname }}.yaml"
        flat: true

- name: "Epic 1-4: Merge Kubeconfigs and Clean Up Temp Files"
  hosts: mgmt
  become: false
  tags:
    - kubeconfig
  tasks:
    - name: Update IP and context name in active.yaml
      shell: |
        sed -i 's/127.0.0.1/172.16.100.1/g' /home/ubuntu/ota-platform/ansible/active.yaml
        sed -i 's/default/active/g' /home/ubuntu/ota-platform/ansible/active.yaml

    - name: Update IP and context name in standby.yaml
      shell: |
        sed -i 's/127.0.0.1/172.16.200.1/g' /home/ubuntu/ota-platform/ansible/standby.yaml
        sed -i 's/default/standby/g' /home/ubuntu/ota-platform/ansible/standby.yaml

    - name: Ensure .kube directory exists
      file:
        path: /home/ubuntu/.kube
        state: directory
        mode: '0700'

    - name: Merge active and standby kubeconfigs into ~/.kube/config
      shell: |
        KUBECONFIG=/home/ubuntu/ota-platform/ansible/active.yaml:/home/ubuntu/ota-platform/ansible/standby.yaml \
        kubectl config view --flatten > /home/ubuntu/.kube/config

    - name: Set strict permissions on kubeconfig (Owner read/write only)
      file:
        path: /home/ubuntu/.kube/config
        mode: '0600'

    - name: Securely delete temporary raw kubeconfig files
      file:
        path: "/home/ubuntu/ota-platform/ansible/{{ item }}"
        state: absent
      loop:
        - active.yaml
        - standby.yaml

---
- name: "Phase 1: Setup Management Control Tower Base & Tailscale"
  hosts: mgmt
  become: true
  vars_files:
    - secrets.yml
  roles:
    - role: mgmt_base
      tags: [mgmt_base]
    - role: tailscale
      tags: [tailscale]

- name: "Phase 2: Provision K3s Clusters"
  hosts: k3s_clusters
  become: true
  roles:
    - role: k3s
      tags: [k3s]

- name: "Phase 3: Fetch & Merge Kubeconfigs"
  hosts: mgmt
  become: false
  roles:
    - role: kubeconfig
      tags: [kubeconfig]

- name: "Phase 4: Deploy Control Tower Services (Postgres Primary, Redis, HAProxy, Jenkins)"
  hosts: mgmt
  become: true
  vars_files:
    - secrets.yml
  roles:
    - role: control_tower
      tags: [control_tower]

- name: "Phase 5: Deploy FastAPI OTA Backend & L7 Heartbeat Agent"
  hosts: mgmt
  become: false
  vars_files:
    - secrets.yml
  roles:
    - role: ota_api
      tags: [ota_api]
    - role: heartbeat
      become: true
      tags: [heartbeat]

- name: "Phase 6: Configure DR PostgreSQL Standby Replica (Run after Terraform apply)"
  hosts: dr_db
  become: true
  vars_files:
    - secrets.yml
  vars:
    primary_tailscale_ip: "{{ hostvars['localhost'].mgmt_tailscale_ip }}"
  roles:
    - role: dr_db
      tags: [dr_db, never]

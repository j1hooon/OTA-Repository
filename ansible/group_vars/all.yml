---
ansible_user: ubuntu
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

control_dir: /opt/ota-control-tower
mgmt_internal_ip: "172.16.10.1"
ota_nodeport: 30080

# HAProxy 헬스체크 튜닝 (절체 시간 RTO <-> 오탐 위험의 트레이드오프)
#   무응답 장애 시 RTO 는 대략 inter 의 3~4배(체크 타임아웃이 inter 와 같아 매 체크가 inter 만큼 대기)
#   -e haproxy_check_inter=500 처럼 덮어써서 실험하고, 결정한 값을 여기에 반영한다.
haproxy_check_inter: 500   # ms
haproxy_check_fall: 2       # 연속 실패 N회면 DOWN
haproxy_check_rise: 2       # 연속 성공 N회면 UP
aws_region: "ap-northeast-1"

firmware_bucket: "{{ vault_firmware_bucket }}"
cdn_domain: "{{ vault_cdn_domain }}"

# 클러스터별 토폴로지 정의 (active / standby / 향후 dr 확장)
ota_clusters:
  active:
    node_ip: "172.16.100.1"
    pg_host: "172.16.10.1"
    redis_host: "172.16.10.1"
    flannel_iface: "eth1"
  standby:
    node_ip: "172.16.200.1"
    pg_host: "172.16.10.1"
    redis_host: "172.16.10.1"
    flannel_iface: "eth1"

---
- name: Install Docker and Docker Compose Plugin
  ansible.builtin.shell: |
    curl -fsSL https://get.docker.com | sh
    apt-get update && apt-get install -y docker-compose-plugin
  args:
    creates: /usr/bin/docker

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Install kubectl
  ansible.builtin.command: snap install kubectl --classic
  args:
    creates: /snap/bin/kubectl

- name: Install AWS CLI v2 via snap
  ansible.builtin.command: snap install aws-cli --classic
  args:
    creates: /snap/bin/aws

- name: Install Terraform via snap
  ansible.builtin.command: snap install terraform --classic
  args:
    creates: /snap/bin/terraform

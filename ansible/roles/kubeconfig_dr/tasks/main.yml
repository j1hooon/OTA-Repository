---
# DR kubeconfig 를 mgmt 의 ~/.kube/config 에 "추가" 병합한다.
# 기존 kubeconfig 롤과 달리 active/standby 컨텍스트를 지우지 않는다.
- name: Fetch k3s.yaml from DR node
  delegate_to: "{{ groups['dr_k3s'][0] }}"
  become: true
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: dr_kubeconfig

- name: Ensure ~/.kube exists
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

# dr.yaml 은 남겨 둔다: 이후 kubeconfig 롤(site.yml --tags kubeconfig)이 *.yaml 을 합칠 때 dr 도 포함된다.
- name: Write DR kubeconfig (context name = dr, server = Tailscale IP)
  ansible.builtin.copy:
    dest: /home/ubuntu/.kube/dr.yaml
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    content: >-
      {{ dr_kubeconfig.content | b64decode
         | replace('127.0.0.1', hostvars[groups['dr_k3s'][0]].ansible_host)
         | replace('default', 'dr') }}
  no_log: true

- name: Merge dr.yaml into existing ~/.kube/config (keeps other contexts)
  become: false
  ansible.builtin.shell: |
    set -e
    cd /home/ubuntu/.kube
    if [ -f config ]; then SRC="config:dr.yaml"; else SRC="dr.yaml"; fi
    KUBECONFIG=$SRC kubectl config view --flatten > config.new
    chmod 600 config.new
    mv config.new config
    kubectl config get-contexts -o name
  register: ctxs
  changed_when: "'dr' not in ctxs.stdout_lines"
